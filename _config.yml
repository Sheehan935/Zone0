# GitHub Pages build configuration for zone0landscaping.com
#
# Anything listed under `exclude` is NOT published to the live site.
# These are internal project files: they stay in the repository for
# reference and history, but visitors cannot reach them by URL.

exclude:
  - docs/            # project documentation, internal branding guide, and reports
  - archive/         # historical page versions and old builds
  - README.md
  - CHANGELOG.md
  - TODO.md
